<style>
/* Layout : appli téléphone, une colonne, barre d'onglets fixe en bas ; le court est dessiné en paysage, filet vertical */
:root {
  --bg: #EEF3F2;
  --surface: #FFFFFF;
  --ink: #12232A;
  --muted: #56686D;
  --line: #D2DDDB;
  --accent: #1B5C78;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAF0;
  --ball: #D4E23A;
  --ball-ink: #1B2410;
  --court: #2C6B88;
  --court-out: #3B7F67;
  --court-line: #FFFFFF;
  --good: #23784A;
  --good-soft: #DDF0E4;
  --warn: #A2620F;
  --warn-soft: #F7EAD3;
  --tac: #1B5C78;
  --tec: #8A4B23;
  --phy: #5A4F8F;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D171B; --surface: #15232A; --ink: #E4EDED; --muted: #92A4A8; --line: #263840;
    --accent: #72B6D4; --accent-ink: #0D171B; --accent-soft: #1A3644;
    --ball: #D4E23A; --ball-ink: #1B2410;
    --court: #235670; --court-out: #2C5F4E; --court-line: #F2F6F6;
    --good: #6CCB94; --good-soft: #193628; --warn: #E3AE5C; --warn-soft: #3A2D17;
    --tac: #72B6D4; --tec: #E19A6C; --phy: #B0A6EA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D171B; --surface: #15232A; --ink: #E4EDED; --muted: #92A4A8; --line: #263840;
  --accent: #72B6D4; --accent-ink: #0D171B; --accent-soft: #1A3644;
  --ball: #D4E23A; --ball-ink: #1B2410;
  --court: #235670; --court-out: #2C5F4E; --court-line: #F2F6F6;
  --good: #6CCB94; --good-soft: #193628; --warn: #E3AE5C; --warn-soft: #3A2D17;
  --tac: #72B6D4; --tec: #E19A6C; --phy: #B0A6EA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1; }
h2 { font-size: 24px; line-height: 1.1; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.top small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.count { font-family: var(--display); font-size: 15px; color: var(--muted); white-space: nowrap; }

/* Filtres */
.search { width: 100%; padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filters { display: grid; gap: 2px; margin-bottom: 12px; }

/* Liste */
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.card:active { transform: scale(.995); }
.card .t { font-family: var(--display); font-size: 21px; line-height: 1.1; font-weight: 600; }
.card .o { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
.pill.tactique { color: var(--tac); } .pill.technique { color: var(--tec); } .pill.physique { color: var(--phy); }
.star { background: none; border: 0; font-size: 22px; line-height: 1; padding: 0 2px; color: var(--muted); }
.star[aria-pressed="true"] { color: var(--warn); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* Détail */
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; font-size: 16px; }
.detail { display: grid; gap: 18px; }
.detail header { display: grid; gap: 6px; }
.court { width: 100%; height: auto; display: block; border-radius: var(--r); background: var(--court-out); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); }
.sec { display: grid; gap: 6px; }
.sec ol, .sec ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
.fact b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.kv { display: grid; gap: 2px; }
.kv dt { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.colors { display: grid; gap: 6px; }
.col { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: start; }
.dot { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.dot i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.c-rouge { background: #D9412E; } .c-orange { background: #EE8A1E; } .c-vert { background: #6CB33F; }
.fix { display: grid; gap: 6px; }
.fix div { display: grid; gap: 2px; padding-left: 10px; border-left: 3px solid var(--warn); }
.fix div em { font-style: normal; color: var(--muted); font-size: 14px; }
.indic { background: var(--good-soft); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 4px; }
.indic h3 { color: var(--good); }
textarea { width: 100%; min-height: 80px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); resize: vertical; font-size: 16px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 11px 16px; border-radius: var(--r); font-weight: 600; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--warn); background: transparent; color: var(--warn); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 30; }

/* Séance */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .fieldset legend { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.field input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fieldset legend { width: 100%; margin-bottom: 4px; padding: 0; }
.tog { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.tog input { margin: 0; accent-color: var(--accent); }
.note { background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.items { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.item .n { font-weight: 600; min-width: 0; }
.item .n small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.item .ctl { display: flex; gap: 4px; align-items: center; }
.item input { width: 56px; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); text-align: center; font-variant-numeric: tabular-nums; }
.ib { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; line-height: 1; }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.state { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
.state.ok { background: var(--good-soft); color: var(--good); }
.state.ko { background: var(--warn-soft); color: var(--warn); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; font-size: 14px; min-width: 760px; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td small { display: block; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

/* Repères */
.refs { display: grid; gap: 14px; }
.refs .box p + p { margin-top: 4px; }
.sit { display: grid; gap: 8px; }
.sit div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding-block: 6px; border-top: 1px solid var(--line); }
.sit div:first-child { border-top: 0; }
.sit b { font-family: var(--display); font-size: 18px; font-weight: 600; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* Barre d'onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; padding: 10px 4px 12px; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: .02em; position: relative; }
.tabs button[aria-selected="true"] { color: var(--accent); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: -1px; left: 25%; right: 25%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--ball); color: var(--ball-ink); font-family: var(--body); font-size: 12px; line-height: 18px; vertical-align: 2px; }
@media (max-width: 420px) {
  .sit div { grid-template-columns: 1fr; gap: 2px; }
  .col { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

var KEY = "carnet-tactique-tcb-v1";
var DEFAULT_SEANCE = {
  ex: true,
  pub: "École de tennis (exemple)", coul: ["orange", "vert"], eff: 6, ter: 1, duree: 90,

};
var S = { tab: "ex", f: { axe: "", sit: "", pub: "", fav: false, q: "" }, open: null, fav: [], notes: {}, seance: JSON.parse(JSON.stringify(DEFAULT_SEANCE)), confirmReset: false };

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d.fav) S.fav = d.fav;
      if (d.notes) S.notes = d.notes;
      if (d.seance) S.seance = d.seance;
      if (d.tab) S.tab = d.tab;
      if (d.f) S.f = Object.assign(S.f, d.f);
    }
  } catch (e) {}
  var h = (location.hash || "").replace("#", "");
  if (h === "seance") S.tab = "se"; else if (h === "reperes") S.tab = "re";
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ fav: S.fav, notes: S.notes, seance: S.seance, tab: S.tab, f: S.f })); } catch (e) {}
}

/* ---------- Utilitaires ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
function byId(id) { for (var i = 0; i < EX.length; i++) if (EX[i].id === id) return EX[i]; return null; }
function isFav(id) { return S.fav.indexOf(id) >= 0; }
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1800);
}
function pubLabel(e) { return e.pub.map(function (p) { return PUB[p]; }).join(" · "); }

/* ---------- Schéma du court ---------- */
var uid = 0;
function court(sch) {
  if (!sch) return "";
  uid++;
  var k = 10, L = 23.77, W = 10.97, N = 11.885;
  function X(v) { return (v * k).toFixed(1); }
  var vb = [-2.6 * k, -1.4 * k, (L + 5.2) * k, (W + 2.8) * k].join(" ");
  var o = '<svg class="court" viewBox="' + vb + '" role="img" aria-label="Schéma de l’exercice">';
  o += '<defs><marker id="ab' + uid + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ball)"/></marker>'
    + '<marker id="am' + uid + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--court-line)"/></marker></defs>';
  o += '<rect x="' + (-2.6 * k) + '" y="' + (-1.4 * k) + '" width="' + ((L + 5.2) * k) + '" height="' + ((W + 2.8) * k) + '" fill="var(--court-out)"/>';
  o += '<rect x="0" y="0" width="' + X(L) + '" height="' + X(W) + '" fill="var(--court)"/>';
  var ln = 'stroke="var(--court-line)" stroke-width="1.4" fill="none"';
  o += '<rect x="0" y="0" width="' + X(L) + '" height="' + X(W) + '" ' + ln + '/>';
  o += '<line x1="0" y1="' + X(1.37) + '" x2="' + X(L) + '" y2="' + X(1.37) + '" ' + ln + '/>';
  o += '<line x1="0" y1="' + X(W - 1.37) + '" x2="' + X(L) + '" y2="' + X(W - 1.37) + '" ' + ln + '/>';
  o += '<line x1="' + X(N - 5.485) + '" y1="' + X(1.37) + '" x2="' + X(N - 5.485) + '" y2="' + X(W - 1.37) + '" ' + ln + '/>';
  o += '<line x1="' + X(N + 5.485) + '" y1="' + X(1.37) + '" x2="' + X(N + 5.485) + '" y2="' + X(W - 1.37) + '" ' + ln + '/>';
  o += '<line x1="' + X(N - 5.485) + '" y1="' + X(W / 2) + '" x2="' + X(N + 5.485) + '" y2="' + X(W / 2) + '" ' + ln + '/>';
  o += '<line x1="0" y1="' + X(W / 2) + '" x2="3" y2="' + X(W / 2) + '" ' + ln + '/>';
  o += '<line x1="' + X(L) + '" y1="' + X(W / 2) + '" x2="' + (L * k - 3) + '" y2="' + X(W / 2) + '" ' + ln + '/>';
  o += '<line x1="' + X(N) + '" y1="' + X(-0.9) + '" x2="' + X(N) + '" y2="' + X(W + 0.9) + '" stroke="var(--court-line)" stroke-width="2.6" stroke-dasharray="1.5 2"/>';
  (sch.tg || []).forEach(function (t) {
    o += '<rect x="' + X(t.x) + '" y="' + X(t.y) + '" width="' + X(t.w) + '" height="' + X(t.h) + '" fill="var(--ball)" fill-opacity=".22" stroke="var(--ball)" stroke-width="1.2" stroke-dasharray="4 3"/>';
    if (t.l) o += '<text x="' + X(t.x + t.w / 2) + '" y="' + X(t.y + t.h - 0.35) + '" text-anchor="middle" font-size="9" font-family="Barlow, sans-serif" font-weight="600" fill="var(--court-line)">' + esc(t.l) + '</text>';
  });
  (sch.cones || []).forEach(function (c) {
    o += '<path d="M' + X(c[0]) + ' ' + X(c[1] - 0.45) + ' l4.5 8 h-9 z" fill="#EE8A1E" stroke="var(--court-line)" stroke-width=".6" transform="translate(0,-1)"/>';
  });
  (sch.mv || []).forEach(function (m) {
    o += '<line x1="' + X(m[0]) + '" y1="' + X(m[1]) + '" x2="' + X(m[2]) + '" y2="' + X(m[3]) + '" stroke="var(--court-line)" stroke-width="1.6" marker-end="url(#am' + uid + ')" opacity=".9"/>';
  });
  (sch.balls || []).forEach(function (b) {
    o += '<line x1="' + X(b[0]) + '" y1="' + X(b[1]) + '" x2="' + X(b[2]) + '" y2="' + X(b[3]) + '" stroke="var(--ball)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ab' + uid + ')"/>';
    if (b[4]) {
      var mx = b[0] + (b[2] - b[0]) * 0.45, my = b[1] + (b[3] - b[1]) * 0.45;
      o += '<circle cx="' + X(mx) + '" cy="' + X(my) + '" r="6.5" fill="var(--ball)"/><text x="' + X(mx) + '" y="' + (my * k + 3.2).toFixed(1) + '" text-anchor="middle" font-size="9" font-weight="700" font-family="Barlow, sans-serif" fill="var(--ball-ink)">' + esc(b[4]) + '</text>';
    }
  });
  (sch.pl || []).forEach(function (p) {
    var fill = p.k === "j" ? "var(--ball)" : (p.k === "c" ? "#D9412E" : "var(--court-line)");
    var ink = p.k === "c" ? "#FFFFFF" : "var(--ball-ink)";
    o += '<circle cx="' + X(p.x) + '" cy="' + X(p.y) + '" r="9" fill="' + fill + '" stroke="var(--ball-ink)" stroke-width="1"/><text x="' + X(p.x) + '" y="' + (p.y * k + 3.6).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" font-family="Barlow, sans-serif" fill="' + ink + '">' + esc(p.l) + '</text>';
  });
  o += '</svg>';
  o += '<div class="legend"><span><i class="sw" style="background:var(--ball)"></i>joueur</span><span><i class="sw" style="background:var(--court-line)"></i>envoyeur</span><span>- - → balle (n° = ordre)</span><span>—→ déplacement</span>' + ((sch.cones && sch.cones.length) ? '<span><i class="sw" style="background:#EE8A1E;border-radius:2px"></i>coupelle</span>' : '') + '</div>';
  return o;
}

/* ---------- Vues ---------- */
function filtered() {
  var f = S.f, q = f.q.trim().toLowerCase();
  return EX.filter(function (e) {
    if (f.axe && e.axe !== f.axe) return false;
    if (f.sit && e.sit !== f.sit) return false;
    if (f.pub && e.pub.indexOf(f.pub) < 0) return false;
    if (f.fav && !isFav(e.id)) return false;
    if (q) {
      var hay = (e.t + " " + e.obj + " " + e.steps.join(" ") + " " + (S.notes[e.id] || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function chipRow(key, map, allLabel) {
  var o = '<div class="chips" role="group">';
  o += '<button class="chip" data-f="' + key + '" data-v="" aria-pressed="' + (!S.f[key]) + '">' + allLabel + '</button>';
  Object.keys(map).forEach(function (k) {
    o += '<button class="chip" data-f="' + key + '" data-v="' + k + '" aria-pressed="' + (S.f[key] === k) + '">' + map[k] + '</button>';
  });
  return o + '</div>';
}

  o += '<button class="chip" data-f="fav" data-v="1" aria-pressed="' + S.f.fav + '">★ Favoris</button></div></div>';
  if (!list.length) {
    o += '<div class="empty">Aucun exercice pour ces filtres.<br><button class="btn ghost" data-act="clear" style="margin-top:10px">Effacer les filtres</button></div>';
  } else {
    o += '<div class="list">';
    list.forEach(function (e) {
      var fr = e.fpm ? (e.fpm * e.dur) + ' frappes' : 'sans balle';
      o += '<div class="card" role="button" tabindex="0" data-open="' + e.id + '">'
        + '<div class="t">' + esc(e.t) + '</div>'
        + '<button class="star" data-star="' + e.id + '" aria-pressed="' + isFav(e.id) + '" aria-label="Favori">' + (isFav(e.id) ? '★' : '☆') + '</button>'
        + '<p class="o">' + esc(e.obj) + '</p>'
        + '<div class="meta"><span class="pill ' + e.axe + '">' + e.axe + '</span><span>' + SIT[e.sit] + '</span><span>· ' + e.dur + ' min</span><span>· ' + fr + '</span><span>· ' + pubLabel(e) + '</span>' + (S.notes[e.id] ? '<span>· ✎ note</span>' : '') + '</div>'
        + '</div>';
    });
    o += '</div>';
  }
  return o;
}
function kv(label, val) { return '<div class="kv"><dt>' + label + '</dt><dd>' + val + '</dd></div>'; }
function viewDetail(e) {
  var inSeance = S.seance.items.some(function (i) { return i.id === e.id; });
  var o = '<button class="back" data-act="back">‹ Exercices</button><article class="detail">';
  o += '<header><div class="meta"><span class="pill ' + e.axe + '">' + e.axe + '</span><span>' + SIT[e.sit] + '</span><span>· ' + pubLabel(e) + '</span></div><h2>' + esc(e.t) + '</h2><p>' + esc(e.obj) + '</p></header>';
  o += '<div class="facts"><div class="fact"><b>' + e.dur + ' min</b><span>durée</span></div><div class="fact"><b>' + (e.fpm ? '≈ ' + (e.fpm * e.dur) : '—') + '</b><span>frappes / joueur</span></div><div class="fact"><b>' + (e.fpm || '—') + '</b><span>frappes / min</span></div></div>';
  if (e.sch) o += '<div>' + court(e.sch) + '</div>';
  o += '<section class="sec box"><h3>Mise en place</h3><dl style="margin:0;display:grid;gap:8px">' + kv("Effectif", esc(e.eff)) + kv("Matériel", esc(e.mat)) + kv("Placement", esc(e.place)) + '</dl></section>';
  o += '<section class="sec"><h3>Déroulement</h3><ol>' + e.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ol></section>';
  o += '<section class="sec box"><dl style="margin:0;display:grid;gap:8px">' + kv("Rotation", esc(e.rot)) + kv("Comptage", esc(e.score)) + kv("Défi", esc(e.defi)) + kv("Critère de réussite", esc(e.reussite)) + '</dl></section>';
  if (e.coul) {
    o += '<section class="sec"><h3>Consignes par couleur</h3><div class="colors">';
    Object.keys(COUL).forEach(function (c) { if (e.coul[c]) o += '<div class="col"><span class="dot"><i class="c-' + c + '"></i>' + COUL[c] + '</span><span>' + esc(e.coul[c]) + '</span></div>'; });
    o += '</div></section>';
  }
  o += '<section class="sec"><h3>Faire varier</h3><dl style="margin:0;display:grid;gap:8px">' + kv("Plus facile", esc(e.facile)) + kv("Plus dur", esc(e.dur2)) + '</dl></section>';
  o += '<section class="sec"><h3>Ce que j’observe</h3><ul>' + e.obs.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul></section>';
  o += '<section class="sec"><h3>Erreur → correction</h3><div class="fix">' + e.err.map(function (r) { return '<div><span>' + esc(r[0]) + '</span><em>→ ' + esc(r[1]) + '</em></div>'; }).join("") + '</div></section>';
  o += '<section class="indic"><h3>Indicateur</h3><p>' + esc(e.indic) + '</p></section>';
  o += '<section class="sec"><h3><label for="note">Mes notes</label></h3><textarea id="note" data-note="' + e.id + '" placeholder="Ce qui a marché, adaptations, résultats des enfants…">' + esc(S.notes[e.id] || "") + '</textarea></section>';
  o += '<div class="actions"><button class="btn" data-add="' + e.id + '">' + (inSeance ? '＋ Ajouter encore à la séance' : '＋ Ajouter à la séance') + '</button><button class="btn ghost" data-star="' + e.id + '" aria-pressed="' + isFav(e.id) + '">' + (isFav(e.id) ? '★ En favori' : '☆ Favori') + '</button></div>';
  o += '</article>';
  return o;
}

/* Séance */
function couleursSel() { return S.seance.coul || []; }
function consignes(e) {
  var cs = couleursSel();
  if (!e.coul || !cs.length) return esc(e.coul ? "Voir l’exercice" : "Même consigne pour tous");
  return cs.map(function (c) { return '<b>' + COUL[c] + '</b> : ' + esc(e.coul[c] || "comme vert"); }).join("<br>");
}
function totals() {
  var dur = 0, fr = 0;
  S.seance.items.forEach(function (it) { var e = byId(it.id); if (!e) return; dur += it.d; fr += e.fpm * it.d; });
  return { dur: dur, fr: fr, parH: dur ? Math.round(fr * 60 / dur) : 0 };
}
function viewSeance() {
  var se = S.seance, t = totals();
  var o = '<div class="top"><div><h1>Ma séance</h1><small>Fiche au format fixe, prête à copier</small></div></div>';
  if (se.ex) o += '<p class="note" style="margin-bottom:12px">Séance d’exemple (6 enfants, orange et vert, 1 terrain, 1h30). Modifie-la ou vide-la pour partir de zéro.</p>';
  o += '<div class="form">'
    + '<div class="field full"><label for="s-pub">Public</label><input id="s-pub" data-s="pub" value="' + esc(se.pub) + '"></div>'
    + '<fieldset class="fieldset full"><legend>Couleurs présentes</legend>'
    + Object.keys(COUL).map(function (c) { return '<label class="tog"><input type="checkbox" id="s-c-' + c + '" data-coul="' + c + '"' + (se.coul.indexOf(c) >= 0 ? " checked" : "") + '><i class="sw c-' + c + '" style="width:10px;height:10px"></i>' + COUL[c] + '</label>'; }).join("")
    + '</fieldset>'
    + '<div class="field"><label for="s-eff">Effectif</label><input id="s-eff" type="number" inputmode="numeric" min="1" data-s="eff" value="' + se.eff + '"></div>'
    + '<div class="field"><label for="s-ter">Terrains</label><input id="s-ter" type="number" inputmode="numeric" min="1" data-s="ter" value="' + se.ter + '"></div>'
    + '<div class="field"><label for="s-duree">Durée (min)</label><input id="s-duree" type="number" inputmode="numeric" min="10" step="5" data-s="duree" value="' + se.duree + '"></div>'
    + '<div class="field full"><label for="s-obj">Objectif</label><input id="s-obj" data-s="objectif" value="' + esc(se.objectif) + '"></div>'
    + '</div>';
  var reste = se.duree - t.dur;
  var okF = t.parH >= 300;
  o += '<div class="sum" style="margin-top:14px"><div class="fact"><b>' + t.dur + ' / ' + se.duree + '</b><span>minutes</span><div><span class="state ' + (reste >= 0 ? 'ok' : 'ko') + '">' + (reste >= 0 ? reste + ' min libres' : (-reste) + ' min de trop') + '</span></div></div>'
    + '<div class="fact"><b>≈ ' + t.fr + '</b><span>frappes / enfant</span></div>'
    + '<div class="fact"><b>' + t.parH + '</b><span>frappes / heure</span><div><span class="state ' + (okF ? 'ok' : 'ko') + '">' + (okF ? 'repère 300-400 ✓' : 'sous 300') + '</span></div></div></div>';
  o += '<h3 style="margin:18px 0 8px">Ateliers</h3>';
  if (!se.items.length) {
    o += '<div class="empty">Aucun atelier. Ouvre un exercice et touche « Ajouter à la séance ».<br><button class="btn ghost" data-tabgo="ex" style="margin-top:10px">Voir les exercices</button></div>';
  } else {
    o += '<div class="items">';
    se.items.forEach(function (it, i) {
      var e = byId(it.id); if (!e) return;
      o += '<div class="item"><div class="n">' + esc(e.t) + '<small>' + SIT[e.sit] + ' · ' + (e.fpm ? '≈ ' + e.fpm * it.d + ' frappes' : 'sans balle') + '</small></div>'
        + '<div class="ctl"><input type="number" inputmode="numeric" min="1" id="d-' + i + '" data-dur="' + i + '" value="' + it.d + '" aria-label="Durée en minutes"><button class="ib" data-mv="' + i + '" data-dir="-1" aria-label="Monter">↑</button><button class="ib" data-mv="' + i + '" data-dir="1" aria-label="Descendre">↓</button><button class="ib" data-rm="' + i + '" aria-label="Retirer">✕</button></div></div>';
    });
    o += '</div>';
  }
  if (se.items.length) {
    o += '<h3 style="margin:18px 0 8px">Fiche séance</h3><div class="tablewrap"><table><thead><tr><th>Atelier</th><th>Durée</th><th>Matériel</th><th>Consigne par couleur</th><th>Défi</th><th>Critère de réussite</th><th>Frappes</th></tr></thead><tbody>';
    se.items.forEach(function (it) {
      var e = byId(it.id); if (!e) return;
      o += '<tr><td><b>' + esc(e.t) + '</b><small>' + esc(e.obj) + '</small></td><td class="num">' + it.d + ' min</td><td>' + esc(e.mat) + '</td><td>' + consignes(e) + '</td><td>' + esc(e.defi) + '</td><td>' + esc(e.reussite) + '</td><td class="num">' + (e.fpm ? '≈ ' + e.fpm * it.d : '—') + '</td></tr>';
    });
    o += '<tr><td colspan="6"><b>Total par enfant</b></td><td class="num"><b>≈ ' + t.fr + '</b></td></tr></tbody></table></div>';
  }
  o += '<div class="actions" style="margin-top:14px"><button class="btn" data-act="copy">Copier la fiche</button>';
  if (S.confirmReset) o += '<span class="confirm">Vider la séance ? <button class="btn danger" data-act="reset-yes">Oui, vider</button><button class="btn ghost" data-act="reset-no">Annuler</button></span>';
  else o += '<button class="btn ghost" data-act="reset">Vider</button><button class="btn ghost" data-act="sample">Recharger l’exemple</button>';
  o += '</div><textarea id="copyzone" readonly hidden style="margin-top:10px;min-height:200px"></textarea>';
  return o;
}
function seanceText() {
  var se = S.seance, t = totals();
  var L = [];
  L.push("FICHE SÉANCE");
  L.push("Public : " + se.pub);
  L.push("Couleurs : " + (se.coul.length ? se.coul.map(function (c) { return COUL[c]; }).join(", ") : "—") + " · Effectif : " + se.eff + " · Terrains : " + se.ter + " · Durée : " + se.duree + " min");
  L.push("Objectif : " + se.objectif);
  L.push("");
  se.items.forEach(function (it, i) {
    var e = byId(it.id); if (!e) return;
    L.push((i + 1) + ". " + e.t + " — " + it.d + " min" + (e.fpm ? " — ≈ " + e.fpm * it.d + " frappes" : ""));
    L.push("   Matériel : " + e.mat);
    L.push("   Placement : " + e.place);
    e.steps.forEach(function (s) { L.push("   - " + s); });
    if (e.coul && se.coul.length) se.coul.forEach(function (c) { if (e.coul[c]) L.push("   " + COUL[c] + " : " + e.coul[c]); });
    L.push("   Rotation : " + e.rot);
    L.push("   Comptage : " + e.score);
    L.push("   Défi : " + e.defi);
    L.push("   Réussite : " + e.reussite);
    L.push("");
  });
  L.push("Total : " + t.dur + " min · ≈ " + t.fr + " frappes par enfant (" + t.parH + " / heure)");
  return L.join("\n");
}

/* Repères */
function viewRefs() {
  var o = '<div class="top"><div><h1>Repères</h1><small>Ce qu’on rappelle aux joueurs, et les chiffres du court</small></div></div><div class="refs">';
  o += '<section class="box"><h3>Situations de jeu et intention</h3><div class="sit">'
    + '<div><b>Servir</b><span>Prendre l’initiative : placement avant vitesse, puis « + 1 » en coup droit dans le côté ouvert.</span></div>'
    + '<div><b>Retourner</b><span>Neutraliser : retour profond au centre sur 1re balle, retour d’attaque sur 2e balle faible.</span></div>'
    + '<div><b>Construire</b><span>Profondeur et diagonale, patience. Changer de direction seulement sur une balle confortable, frappée dans le court.</span></div>'
    + '<div><b>Attaquer</b><span>Balle courte = j’avance. Approche long de ligne, je suis ma balle, arrêt en appuis quand l’adversaire frappe.</span></div>'
    + '<div><b>Défendre</b><span>Gagner du temps : haut, profond, au centre. Replacement au centre des angles possibles.</span></div>'
    + '<div><b>Filet</b><span>Volée bloquée, tamis devant. Première volée profonde, la suivante pour finir (courte croisée ou dans l’ouverture).</span></div>'
    + '</div></section>';
  o += '<section class="box"><h3>Lire sa zone</h3><p><b>Derrière la ligne de fond (+1 m) :</b> défense, balle haute et croisée.</p><p><b>Autour de la ligne de fond :</b> construction, profond et croisé.</p><p><b>Dans le court :</b> attaque, long de ligne ou ouverture, puis j’avance.</p></section>';
  o += '<section><h3 style="margin-bottom:8px">Les chiffres du court</h3><div class="nums">'
    + '<div class="fact"><b>0,914 m</b><span>filet au centre</span></div>'
    + '<div class="fact"><b>1,07 m</b><span>filet aux poteaux</span></div>'
    + '<div class="fact"><b>≈ 25,1 m</b><span>diagonale du simple</span></div>'
    + '<div class="fact"><b>23,77 m</b><span>long de ligne</span></div>'
    + '</div><p style="margin-top:8px;color:var(--muted);font-size:14px">Le croisé passe au-dessus du filet le plus bas et offre ≈ 1,4 m de court en plus : c’est le coup de sécurité. Le long de ligne passe là où le filet est le plus haut, sur la distance la plus courte : c’est un coup d’attaque.</p></section>';
  o += '<section class="box"><h3>Marges</h3><p>Viser 1 m au-dessus du filet et 1 m à l’intérieur des lignes. En difficulté : plus haut, pas plus fort.</p></section>';
  o += '<section class="box"><h3>Cadre Galaxie (école de tennis)</h3><p>300 à 400 frappes par enfant et par heure.</p><p>Ateliers de 7 min minimum (démo + défi), 4 à 5 par séance.</p><p>Un match ou un tournoi à chaque séance.</p><p>Évaluation sur 3 axes : compétition, technique (critères de passage par couleur), pratique.</p><p>Groupes mélangés : 3 couleurs au plus sur un court, binômes fixes par zone, une consigne commune déclinée par couleur.</p></section>';
  o += '</div>';
  return o;
}

/* ---------- Rendu et événements ---------- */
var app = document.getElementById("app");
function render() {
  var html;
  if (S.tab === "ex") html = S.open ? viewDetail(byId(S.open)) : viewList();
  else if (S.tab === "se") html = viewSeance();
  else html = viewRefs();
  app.innerHTML = html;
  document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === S.tab); });
  var n = S.seance.items.length;
  document.getElementById("tab-se").innerHTML = 'Séance' + (n ? '<span class="badge">' + n + '</span>' : '');
}
function go(tab) { S.tab = tab; S.open = null; S.confirmReset = false; save(); render(); window.scrollTo(0, 0); }

document.getElementById("tabs").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-tab]"); if (b) go(b.dataset.tab);
});
app.addEventListener("click", function (ev) {
  var t = ev.target;
  var star = t.closest("[data-star]");
  if (star) {
    ev.stopPropagation();
    var id = star.dataset.star, i = S.fav.indexOf(id);
    if (i >= 0) S.fav.splice(i, 1); else S.fav.push(id);
    save(); render(); return;
  }
  var chip = t.closest("[data-f]");
  if (chip) {
    var k = chip.dataset.f;
    if (k === "fav") S.f.fav = !S.f.fav; else S.f[k] = chip.dataset.v;
    save(); render(); return;
  }
  var open = t.closest("[data-open]");
  if (open) { S.open = open.dataset.open; render(); window.scrollTo(0, 0); return; }
  var add = t.closest("[data-add]");
  if (add) {
    var e = byId(add.dataset.add);
    S.seance.items.push({ id: e.id, d: e.dur }); S.seance.ex = false;
    save(); render(); toast("Ajouté à la séance"); return;
  }
  var mv = t.closest("[data-mv]");
  if (mv) {
    var a = +mv.dataset.mv, b = a + (+mv.dataset.dir), it = S.seance.items;
    if (b >= 0 && b < it.length) { var tmp = it[a]; it[a] = it[b]; it[b] = tmp; S.seance.ex = false; save(); render(); }
    return;
  }
  var rm = t.closest("[data-rm]");
  if (rm) { S.seance.items.splice(+rm.dataset.rm, 1); S.seance.ex = false; save(); render(); return; }
  var tg = t.closest("[data-tabgo]");
  if (tg) { go(tg.dataset.tabgo); return; }
  var act = t.closest("[data-act]");
  if (!act) return;
  var A = act.dataset.act;
  if (A === "back") { S.open = null; render(); return; }
  if (A === "clear") { S.f = { axe: "", sit: "", pub: "", fav: false, q: "" }; save(); render(); return; }
  if (A === "reset") { S.confirmReset = true; render(); return; }
  if (A === "reset-no") { S.confirmReset = false; render(); return; }
  if (A === "reset-yes") { S.seance = { ex: false, pub: "", coul: [], eff: 6, ter: 1, duree: 90, objectif: "", items: [] }; S.confirmReset = false; save(); render(); toast("Séance vidée"); return; }
  if (A === "sample") { S.seance = JSON.parse(JSON.stringify(DEFAULT_SEANCE)); save(); render(); toast("Exemple rechargé"); return; }
  if (A === "copy") {
    var txt = seanceText();
    var fallback = function () { var z = document.getElementById("copyzone"); z.hidden = false; z.value = txt; z.focus(); z.select(); toast("Sélectionné : copie avec le menu"); };
    try {
      navigator.clipboard.writeText(txt).then(function () { toast("Fiche copiée"); }, fallback);
    } catch (e2) { fallback(); }
  }
});
app.addEventListener("keydown", function (ev) {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-open]")) { ev.preventDefault(); ev.target.click(); }
});
app.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "q") {
    S.f.q = t.value; save();
    var pos = t.selectionStart; render();
    var q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {}
    return;
  }
  if (t.dataset.note) { if (t.value.trim()) S.notes[t.dataset.note] = t.value; else delete S.notes[t.dataset.note]; save(); return; }
  if (t.dataset.s) {
    var k = t.dataset.s;
    S.seance[k] = t.type === "number" ? (parseInt(t.value, 10) || 0) : t.value;
    S.seance.ex = false; save();
    return;
  }
});
app.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.dataset.coul) {
    var c = t.dataset.coul, arr = S.seance.coul, i = arr.indexOf(c);
    if (t.checked && i < 0) arr.push(c); if (!t.checked && i >= 0) arr.splice(i, 1);
    arr.sort(function (a, b) { return Object.keys(COUL).indexOf(a) - Object.keys(COUL).indexOf(b); });
    S.seance.ex = false; save(); render(); return;
  }
  if (t.dataset.dur != null && t.dataset.dur !== undefined && t.matches("[data-dur]")) {
    S.seance.items[+t.dataset.dur].d = Math.max(1, parseInt(t.value, 10) || 1); S.seance.ex = false; save(); render(); return;
  }
  if (t.dataset.s && t.type === "number") { render(); }
});

load();
render();
</script>
